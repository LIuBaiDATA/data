name: Build Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'  # 与 Kivy 2.1.0 兼容性最佳

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo5 cmake libffi-dev libssl-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          automake autoconf-archive

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          # 核心修复：强制安装旧版 wheel 和 setuptools，避开 wheel.cli 报错
          pip install "wheel==0.37.1" "setuptools==57.0.0" 
          pip install buildozer cython==0.29.33 virtualenv

      - name: Build APK
        run: |
          export BUILDOZER_WARN_ON_ROOT=1
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APK
          path: bin/*.apk
          if-no-files-found: error