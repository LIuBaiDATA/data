name: Shipit Cloud Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04 # 强制使用 22.04 版本，保留 libtinfo5，避开 24.04 的坑
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3-dev openjdk-17-jdk zip unzip ccache libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Build with Buildozer
        run: |
          export BUILDOZER_WARN_ON_ROOT=1
          buildozer -v android debug

      - name: Show APK outputs
        if: always()
        run: |
          ls -la bin/ 2>/dev/null || echo "(no bin yet)"
          find . -name "*.apk" 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn